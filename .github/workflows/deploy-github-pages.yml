name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-samuel-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build for GitHub Pages
        run: npm run build
        env:
          VITE_JBCH_BFF_URL: ${{ secrets.VITE_JBCH_BFF_URL }}
          VITE_ADMIN_USERIDS: ${{ secrets.VITE_ADMIN_USERIDS }}
          VITE_JBCH_SUPPORT_LABEL: ${{ secrets.VITE_JBCH_SUPPORT_LABEL }}

      - name: Deploy to devrenio.github.io/samuel
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: devRenio/devRenio.github.io
          publish_branch: main
          publish_dir: ./dist
          destination_dir: samuel
          keep_files: true
          enable_jekyll: false
          commit_message: "deploy: samuel from devRenio/samuel-memorizer@${{ github.sha }}"
